<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carvex</title>
  <meta name="description" content="Tudo o que você precisa, em um só lugar.">
  <meta name="theme-color" content="#0059df">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="scenes" aria-hidden="true">
    <div id="bubbles"></div>
    <!-- SITE: janela de navegador + diamantes -->
    <div class="scene" data-scene="site">
      <svg class="s-site" viewBox="0 0 220 160">
        <rect x="6" y="6" width="208" height="148" rx="12"/>
        <line x1="6" y1="32" x2="214" y2="32"/>
        <circle cx="22" cy="19" r="3.5"/><circle cx="36" cy="19" r="3.5"/><circle cx="50" cy="19" r="3.5"/>
        <rect x="24" y="48" width="90" height="12" rx="6" class="draw"/>
        <rect x="24" y="70" width="140" height="8" rx="4"/>
        <rect x="24" y="86" width="110" height="8" rx="4"/>
        <rect x="24" y="112" width="60" height="22" rx="11" class="fill"/>
        <path class="gem" d="M170 60l16 16-16 24-16-24z"/>
      </svg>
    </div>

    <!-- ROBÔ: robozinho andando no rodapé -->
    <div class="scene" data-scene="robot">
      <div class="ground"></div>
      <div class="walker">
        <svg class="robot" viewBox="0 0 80 110">
          <g class="bob">
            <line x1="40" y1="4" x2="40" y2="14"/><circle cx="40" cy="4" r="3.5" class="fill"/>
            <rect x="20" y="14" width="40" height="30" rx="9"/>
            <circle cx="31" cy="28" r="4" class="fill eye"/><circle cx="49" cy="28" r="4" class="fill eye"/>
            <rect x="22" y="48" width="36" height="32" rx="8"/>
            <circle cx="40" cy="64" r="5"/>
            <g class="arm a1"><line x1="22" y1="54" x2="10" y2="74"/></g>
            <g class="arm a2"><line x1="58" y1="54" x2="70" y2="74"/></g>
            <g class="leg l1"><line x1="32" y1="80" x2="32" y2="102"/><line x1="32" y1="102" x2="40" y2="102"/></g>
            <g class="leg l2"><line x1="48" y1="80" x2="48" y2="102"/><line x1="48" y1="102" x2="56" y2="102"/></g>
          </g>
        </svg>
      </div>
    </div>

    <!-- EXCEL: planilha, barras e pizza -->
    <div class="scene" data-scene="excel">
      <svg class="s-grid" viewBox="0 0 200 150">
        <rect x="4" y="4" width="192" height="142" rx="8"/>
        <rect x="4" y="4" width="192" height="26" rx="8" class="fill soft"/>
        <line x1="4" y1="56" x2="196" y2="56"/><line x1="4" y1="82" x2="196" y2="82"/>
        <line x1="4" y1="108" x2="196" y2="108"/>
        <line x1="52" y1="4" x2="52" y2="146"/><line x1="100" y1="4" x2="100" y2="146"/>
        <line x1="148" y1="4" x2="148" y2="146"/>
        <rect x="104" y="60" width="40" height="18" class="fill blink"/>
        <rect x="56" y="112" width="40" height="18" class="fill blink b2"/>
      </svg>
      <svg class="s-bars" viewBox="0 0 160 110">
        <line x1="6" y1="104" x2="154" y2="104"/>
        <rect class="bar" style="--d:0s"   x="16"  y="60" width="20" height="44"/>
        <rect class="bar" style="--d:.3s"  x="46"  y="36" width="20" height="68"/>
        <rect class="bar" style="--d:.6s"  x="76"  y="48" width="20" height="56"/>
        <rect class="bar" style="--d:.9s"  x="106" y="16" width="20" height="88"/>
      </svg>
      <svg class="s-pie" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="34"/>
        <circle class="slice" cx="50" cy="50" r="34" pathLength="100"/>
      </svg>
    </div>

    <!-- BUSINESS: gráfico de linha crescendo -->
    <div class="scene" data-scene="business">
      <svg class="s-line" viewBox="0 0 260 170">
        <line x1="10" y1="10" x2="10" y2="160"/><line x1="10" y1="160" x2="250" y2="160"/>
        <line class="grid" x1="10" y1="110" x2="250" y2="110"/><line class="grid" x1="10" y1="60" x2="250" y2="60"/>
        <polyline class="trend" pathLength="100" points="14,148 56,126 96,134 140,92 184,70 222,24"/>
        <path class="arrow" d="M206 22h20v20"/>
        <circle class="dot" cx="222" cy="24" r="5"/>
      </svg>
      <svg class="s-candles" viewBox="0 0 120 100">
        <g class="cd" style="--d:0s"><line x1="14" y1="20" x2="14" y2="86"/><rect x="8" y="38" width="12" height="30"/></g>
        <g class="cd" style="--d:.4s"><line x1="44" y1="10" x2="44" y2="76"/><rect x="38" y="24" width="12" height="34"/></g>
        <g class="cd" style="--d:.8s"><line x1="74" y1="28" x2="74" y2="92"/><rect x="68" y="44" width="12" height="32" class="fill"/></g>
        <g class="cd" style="--d:1.2s"><line x1="104" y1="2" x2="104" y2="66"/><rect x="98" y="14" width="12" height="36" class="fill"/></g>
      </svg>
    </div>
  </div>

  <main>
    <img id="logo" class="logo" alt="">
    <p id="tagline" class="tagline"></p>
    <ul id="links" class="links"></ul>
  </main>

  <script src="config.js"></script>
  <script>
    document.title = config.title;

    const bubbles = document.getElementById("bubbles");
    for (let i = 0; i < 28; i++) {
      const b = document.createElement("span");
      const size = 4 + Math.random() * 12;
      b.className = "bubble";
      b.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
        `--dx:${(Math.random() - .5) * 120}px;animation-duration:${6 + Math.random() * 10}s;` +
        `animation-delay:${-Math.random() * 14}s`;
      bubbles.appendChild(b);
    }

    const logo = document.getElementById("logo");
    logo.src = config.logo;
    logo.alt = config.logoAlt;

    document.getElementById("tagline").textContent = config.tagline;

    const list = document.getElementById("links");
    links.forEach((link, i) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = link.url;
      a.textContent = link.name;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.setProperty("--i", i);
      if (link.scene) {
        const on = () => (document.body.dataset.active = link.scene);
        const off = () => delete document.body.dataset.active;
        a.addEventListener("mouseenter", on);
        a.addEventListener("focus", on);
        a.addEventListener("touchstart", on, { passive: true });
        a.addEventListener("mouseleave", off);
        a.addEventListener("blur", off);
      }
      li.appendChild(a);
      list.appendChild(li);
    });
  </script>
</body>
</html>
