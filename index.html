<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carvex</title>
  <meta name="description" content="Tudo o que você precisa, em um só lugar.">
  <meta name="theme-color" content="#070b16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main>
    <header class="head">
      <img id="logo" class="logo" alt="">
      <p id="tagline" class="tagline"></p>
    </header>

    <ul id="links" class="links"></ul>

    <footer class="foot">
      <nav id="contact" class="contact"></nav>
      <p id="copyright" class="copyright"></p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script>
    document.title = config.title;

    const logo = document.getElementById("logo");
    logo.src = config.logo;
    logo.alt = config.logoAlt;
    document.getElementById("tagline").textContent = config.tagline;

    const ICONS = {
      site: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 4 5.700 4 9s-1.400 6.400-4 9c-2.600-2.600-4-5.700-4-9s1.400-6.400 4-9z"/>',
      bot: '<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13.500h.01M15 13.500h.01M2 13v2M22 13v2"/>',
      sheet: '<rect x="3.500" y="3.500" width="17" height="17" rx="2.500"/><path d="M3.500 9.500h17M3.500 15h17M9.500 3.500v17"/>',
      layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
      package: '<path d="M12 3l8 4.500v9L12 21l-8-4.500v-9L12 3z"/><path d="M4 7.500l8 4.500 8-4.500M12 12v9"/>',
    };
    const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.site}</svg>`;

    const list = document.getElementById("links");
    links.forEach((l, i) => {
      const li = document.createElement("li");
      li.style.setProperty("--i", i);
      const a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.setProperty("--accent", l.accent || "#5b8cff");
      a.innerHTML =
        `<span class="ico">${svg(l.icon)}</span>` +
        `<span class="txt"><b></b><small></small></span>` +
        `<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>`;
      a.querySelector("b").textContent = l.name;
      a.querySelector("small").textContent = l.desc || "";
      li.appendChild(a);
      list.appendChild(li);
    });

    const contact = document.getElementById("contact");
    const add = (href, label) => {
      if (!href || !label) return;
      const a = document.createElement("a");
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = label;
      contact.appendChild(a);
    };
    if (config.whatsapp) add("https://wa.me/" + config.whatsapp, config.whatsappLabel);
    add(config.instagram, config.instagramLabel);

    document.getElementById("copyright").textContent =
      "© " + new Date().getFullYear() + " " + config.copyright;
  </script>
</body>
</html>
