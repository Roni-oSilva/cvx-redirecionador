<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carvex</title>
  <meta name="description" content="Tudo o que você precisa, em um só lugar.">
  <meta name="theme-color" content="#0059df">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <img id="logo" class="logo" alt="">
    <p id="tagline" class="tagline"></p>
    <ul id="links" class="links"></ul>
  </main>

  <script src="config.js"></script>
  <script>
    document.title = config.title;

    const logo = document.getElementById("logo");
    logo.src = config.logo;
    logo.alt = config.logoAlt;

    document.getElementById("tagline").textContent = config.tagline;

    const list = document.getElementById("links");
    links.forEach((link, i) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = link.url;
      a.textContent = link.name;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.setProperty("--i", i);
      li.appendChild(a);
      list.appendChild(li);
    });
  </script>
</body>
</html>
