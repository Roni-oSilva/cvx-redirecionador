<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carvex — Conteúdo da semana</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { width:1080px; overflow:hidden; position:relative; font-family:"Inter Tight",system-ui,sans-serif; color:#fff;
  background: radial-gradient(ellipse at 75% 40%, var(--c1) 0%, var(--c2) 48%, var(--c3) 100%); }
body.feed { height:1350px; --pt:62px; --pb:60px; --s:1; }
body.story { height:1920px; --pt:250px; --pb:330px; --s:1.12; }
body.t-como  { --c1:#1b5cff; --c2:#0a2fb8; --c3:#020726; --acc:#7cc4ff; --ink:#0a2fb8; }
body.t-curio { --c1:#a67c00; --c2:#4a3500; --c3:#120d02; --acc:#f5d77a; --ink:#5c3d00; }
body.t-ajuda { --c1:#0f7a3e; --c2:#06351c; --c3:#02120a; --acc:#6ee7a0; --ink:#065f2e; }
.wrap { height:100%; padding:var(--pt) 64px var(--pb); display:flex; flex-direction:column; align-items:center; text-align:center; }
.top { display:flex; align-items:center; gap:22px; }
.logo { height:64px; }
.tag { padding:10px 26px; border-radius:999px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.35); font-size:24px; font-weight:800; letter-spacing:.14em; }
h1 { margin-top:30px; font-size:calc(80px * var(--s)); line-height:1.02; font-weight:900; letter-spacing:-.03em; }
h1 em { font-style:normal; color:var(--acc); }
.body { flex:1; width:100%; display:flex; flex-direction:column; justify-content:center; gap:calc(18px * var(--s)); padding:22px 0; min-height:0; }
.foot { text-align:center; }
.cta { display:inline-block; padding:20px 44px; border-radius:999px; background:#fff; color:var(--ink); font-size:32px; font-weight:800; box-shadow:0 20px 50px -18px rgba(0,0,0,.5), 0 0 0 7px rgba(255,255,255,.14); }
.handle { margin-top:16px; font-size:26px; font-weight:600; color:rgba(255,255,255,.85); }
.glass { border-radius:30px; background:linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.07)); border:1.5px solid rgba(255,255,255,.36); box-shadow:0 24px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22); }

/* passos */
.step { display:flex; align-items:center; gap:26px; padding:calc(22px * var(--s)) 30px; text-align:left; position:relative; }
.step .n { width:calc(76px * var(--s)); height:calc(76px * var(--s)); border-radius:50%; background:#fff; color:var(--ink); font-size:calc(38px * var(--s)); font-weight:900; display:grid; place-items:center; flex:none; box-shadow:0 0 30px rgba(255,255,255,.35); }
.step b { display:block; font-size:calc(38px * var(--s)); font-weight:800; line-height:1.08; }
.step span { display:block; margin-top:6px; font-size:calc(26px * var(--s)); color:rgba(255,255,255,.82); line-height:1.25; }

/* curiosidade */
.year { font-size:calc(250px * var(--s)); line-height:.9; font-weight:900; letter-spacing:-.05em; background:linear-gradient(180deg,#fff,var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.fato { font-size:calc(40px * var(--s)); line-height:1.3; color:rgba(255,255,255,.92); max-width:900px; margin:0 auto; }
.fato b { color:var(--acc); }
.punch { margin:calc(14px * var(--s)) auto 0; padding:22px 36px; border-radius:26px; font-size:calc(36px * var(--s)); font-weight:800; line-height:1.2; max-width:900px; }
.voce { font-size:26px; font-weight:800; letter-spacing:.18em; color:var(--acc); }

/* antes e depois */
.pair { display:grid; grid-template-columns:1fr 54px 1fr; align-items:center; gap:14px; }
.pair .a, .pair .b { padding:calc(22px * var(--s)) 24px; border-radius:26px; font-size:calc(30px * var(--s)); font-weight:700; line-height:1.2; text-align:left; min-height:calc(120px * var(--s)); display:flex; flex-direction:column; justify-content:center; }
.pair .a { background:rgba(0,0,0,.28); border:1.5px solid rgba(255,255,255,.18); color:rgba(255,255,255,.85); }
.pair .b { background:#fff; color:var(--ink); }
.pair small { display:block; font-size:calc(21px * var(--s)); font-weight:800; letter-spacing:.12em; margin-bottom:6px; opacity:.7; }
.pair .arrow { font-size:48px; font-weight:900; color:var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="logo" src="../../assets/logo.png" alt="Carvex"><span class="tag" id="tag"></span></div>
  <h1 id="h1"></h1>
  <div class="body" id="body"></div>
  <div class="foot"><div class="cta" id="cta"></div><div class="handle">@carvex_lab</div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const d = parseInt(q.get("d") || "1", 10), f = q.get("f") || "feed";
const step = (n,t,s)=>`<div class="glass step"><div class="n">${n}</div><div><b>${t}</b><span>${s}</span></div></div>`;
const pair = (a,b)=>`<div class="pair"><div class="a"><small>ANTES</small>${a}</div><div class="arrow">→</div><div class="b"><small>COM A CARVEX</small>${b}</div></div>`;
const curio = (voce,year,fato,punch)=>`<div class="voce">${voce}</div><div class="year">${year}</div><p class="fato">${fato}</p><div class="glass punch">${punch}</div>`;

const D = {
 1: { th:"como", tag:"COMO FUNCIONA", h1:'Como funciona um <em>robô de WhatsApp</em>', cta:"Salve para ver depois",
      body: step(1,"O cliente manda mensagem","A qualquer hora, até de madrugada") + step(2,"O robô responde e agenda","Tira dúvidas, marca horário e cobra") + step(3,"Você recebe tudo organizado","Sem perder nenhum atendimento") },
 2: { th:"curio", tag:"CURIOSIDADE", h1:'O primeiro site <em>do mundo</em>', cta:"Compartilhe com alguém",
      body: curio("VOCÊ SABIA?","1991","Ficou no ar em <b>1991</b>, criado por Tim Berners-Lee, no CERN. Tinha só <b>texto e links</b>.","Hoje o seu site pode atender e vender 24h.") },
 3: { th:"ajuda", tag:"COMO AJUDAMOS", h1:'Relatório <em>sem sofrimento</em>', cta:"Quer isso no seu negócio?",
      body: pair("Dados soltos em várias planilhas","Um painel com tudo junto") + pair("Relatório refeito toda semana","Atualiza sozinho") + pair("Só dá para ver no computador","Abre no celular") },
 4: { th:"curio", tag:"CURIOSIDADE", h1:'De onde vem a palavra <em>robô?</em>', cta:"Compartilhe com alguém",
      body: curio("VOCÊ SABIA?","1920","Vem do tcheco <b>“robota”</b>, que quer dizer <b>trabalho pesado</b>. Apareceu na peça R.U.R., de Karel Čapek.","Hoje o robô cuida do trabalho repetitivo.") },
 5: { th:"como", tag:"COMO FUNCIONA", h1:'Como é um projeto <em>com a Carvex</em>', cta:"Salve para ver depois",
      body: step(1,"Entender","Vejo o processo como ele é hoje") + step(2,"Projetar","Proposta fechada. Você aprova antes") + step(3,"Construir","Entrego em partes, você acompanha") + step(4,"Lapidar","Ajusto com o uso real") },
 6: { th:"ajuda", tag:"COMO AJUDAMOS", h1:'Para o <em>seu</em> tipo de negócio', cta:"Qual é o seu? Chama a gente",
      body: pair("Clínica: faltas de pacientes","Lembrete automático no WhatsApp") + pair("Salão: agenda no caderno","Agendamento online 24h") + pair("Oficina: ordem de serviço em papel","OS digital com histórico") + pair("Loja: estoque em falta","Controle de entrada e saída") },
 7: { th:"curio", tag:"CURIOSIDADE", h1:'A planilha que mudou <em>o computador</em>', cta:"Você ainda usa planilha?",
      body: curio("VOCÊ SABIA?","1979","O <b>VisiCalc</b> foi a primeira planilha eletrônica e ajudou a levar o computador para dentro das empresas.","Hoje as planilhas já vêm prontas.") },
};
const x = D[d];
document.body.classList.add(f, "t-" + x.th);
document.getElementById("tag").textContent = x.tag;
document.getElementById("h1").innerHTML = x.h1;
document.getElementById("body").innerHTML = x.body;
document.getElementById("cta").textContent = x.cta;
</script>
</body>
</html>
