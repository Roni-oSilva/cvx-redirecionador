<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carvex Business — Anúncio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
:root { --bg:#0a2c8a; --bg2:#071f66; --deep:#041348; --electric:#a9c4ff; --ice:#c4d6ff; }
body { font-family: "Inter Tight", system-ui, sans-serif; color: #fff; overflow: hidden; position: relative;
  background: radial-gradient(ellipse at 70% 50%, #1d4fd8 0%, var(--bg) 42%, var(--bg2) 78%, var(--deep) 100%); }
body.sq { width:1080px; height:1080px; --k:.7; --h:70px; --pt:50px; --pb:44px; }
body.fd { width:1080px; height:1350px; --k:1.14; --h:84px; --pt:60px; --pb:52px; }
body.st { width:1080px; height:1920px; --k:1.28; --h:98px; --pt:250px; --pb:320px; }
.wrap { position: relative; height: 100%; padding: var(--pt) 60px var(--pb); display: flex; flex-direction: column; align-items: center; text-align: center; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img.i { height: 54px; } .brand img.w { height: 44px; }
.brand small { font: 800 15px "Inter Tight"; letter-spacing: .44em; color: #fff; margin-left: 2px; }
.serif { margin-top: 26px; font: italic 500 calc(var(--h) * .42) "Playfair Display", Georgia, serif; color: var(--ice); }
h1 { margin-top: 10px; font-size: var(--h); line-height: 1.02; font-weight: 900; letter-spacing: -.03em; text-transform: uppercase; }
h1 em { font-style: normal; color: var(--electric); }
.stagewrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; padding-top: 14px; }
.stage { position: relative; width: 800px; height: 560px; transform: scale(var(--k)); flex: none; margin: calc((560px * var(--k) - 560px) / 2) calc((800px * var(--k) - 800px) / 2); }
.cta { display: inline-flex; align-items: center; gap: 14px; background: #fff; color: #0a2c8a; font-weight: 900; font-size: 36px; letter-spacing: .04em; text-transform: uppercase;
  padding: 26px 54px; border-radius: 999px; box-shadow: 0 22px 60px -18px rgba(120,170,255,.9), 0 0 0 8px rgba(255,255,255,.14); }
.cta svg { width: 38px; height: 38px; }
.foot { margin-top: 22px; font-size: 25px; font-weight: 500; color: rgba(255,255,255,.85); }
.foot b { font-weight: 800; color: #fff; }

.iceberg { position: absolute; left: 172px; top: 0; width: 456px; height: 540px;
  -webkit-mask-image: radial-gradient(ellipse 58% 60% at 50% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 58% 60% at 50% 50%, #000 55%, transparent 100%); }
.iceberg img { width: 100%; height: 100%; display: block; }
.tag { position: absolute; left: 50%; top: 14px; translate: -50% 0; font: 800 20px "Inter Tight"; letter-spacing: .3em; padding: 9px 22px; border-radius: 999px; color: #fff;
  background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.4); backdrop-filter: blur(8px); }
.water { position: absolute; left: 20px; right: 20px; top: 172px; height: 2px; background: linear-gradient(90deg, transparent, var(--ice), transparent); opacity: .75; }
.pill { position: absolute; padding: 13px 26px; border-radius: 999px; background: #fff; color: #0a2c8a; font-weight: 800; font-size: 25px; white-space: nowrap; box-shadow: 0 12px 30px rgba(1,8,40,.7); }

.kit { position: absolute; width: 380px; padding: 16px 20px; border-radius: 22px; display: flex; align-items: center; gap: 16px; text-align: left;
  background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); border: 1.5px solid rgba(255,255,255,.34); box-shadow: 0 16px 40px rgba(1,8,40,.5), inset 0 1px 0 rgba(255,255,255,.2); }
.kit i { width: 54px; height: 54px; border-radius: 15px; background: #fff; display: grid; place-items: center; flex: none; }
.kit i svg { width: 30px; height: 30px; fill: none; stroke: #0a2c8a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.kit b { display: block; font-size: 25px; font-weight: 800; line-height: 1.05; }
.kit span { display: block; margin-top: 4px; font-size: 16px; color: var(--ice); line-height: 1.2; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img class="i" src="assets/logo-icon.png" alt=""><img class="w" src="assets/logo-word.png" alt="Carvex"><small>BUSINESS</small></div>
  <div class="serif" id="serif"></div>
  <h1 id="h1"></h1>
  <div class="stagewrap"><div class="stage" id="stage"></div></div>
  <div class="cta">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0a2c8a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.3L3 20l1.3-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
    <span id="cta"></span>
  </div>
  <p class="foot"><b>carvex-bussines.vercel.app</b> &nbsp;·&nbsp; @carvex_lab</p>
</div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get("v") || "problema", f = q.get("f") || "sq";
document.body.classList.add(f);
const I = {
  rest:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',
  clin:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',
  loja:'<path d="M4 9l1-5h14l1 5M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 6 0 2.5 2.5 0 0 0 5 0M5 12v8h14v-8M10 20v-5h4v5"/>',
  salao:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8l12 10M8.5 16L20 6"/>',
  ofi:'<path d="M14.5 6a4 4 0 0 0 4.9 5L10 20.4a2.1 2.1 0 0 1-3-3L16.4 8A4 4 0 0 0 14.5 6z"/>',
  acad:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  imob:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',
  esc:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/>',
};
const kit = (k, n, d, x, y) => `<div class="kit" style="left:${x}px;top:${y}px"><i><svg viewBox="0 0 24 24">${I[k]}</svg></i><div><b>${n}</b><span>${d}</span></div></div>`;
const V = {
  problema: {
    serif: "Você apresenta o problema.",
    h1: 'A Carvex monta <em>a solução.</em>',
    cta: "Encontrar meu kit",
    stage: `<div class="iceberg"><img src="assets/iceberg.webp" alt=""></div><div class="water"></div><div class="tag">PROBLEMA</div>
      <span class="pill" style="left:20px;top:250px;transform:rotate(-5deg)">Dados soltos</span>
      <span class="pill" style="right:0;top:215px;transform:rotate(5deg)">Gargalo operacional</span>
      <span class="pill" style="left:150px;top:330px;transform:rotate(-2deg)">Ineficiência</span>
      <span class="pill" style="right:60px;top:330px;transform:rotate(3deg)">Custos altos</span>
      <span class="pill" style="left:50px;top:420px;transform:rotate(4deg)">Processo lento</span>
      <span class="pill" style="right:20px;top:430px;transform:rotate(-4deg)">Atendimento fraco</span>
      <span class="pill" style="left:275px;top:495px;transform:rotate(-2deg)">Falta de relatórios</span>`,
  },
  kits: {
    serif: "Escolha o kit.",
    h1: 'Um kit completo <em>para o seu negócio.</em>',
    cta: "Ver meu kit",
    stage: [
      kit('rest','Restaurantes','Pedidos, cozinha e caixa',10,10),
      kit('clin','Clínicas','Agenda, pacientes e retornos',410,40),
      kit('loja','Lojas','Vendas, estoque e clientes',10,150),
      kit('salao','Salões e Barbearias','Agenda cheia, clientes voltam',410,180),
      kit('ofi','Oficinas','Ordens de serviço e peças',10,290),
      kit('acad','Academias','Alunos, planos e cobranças',410,320),
      kit('imob','Imobiliárias','Imóveis, leads e contratos',10,430),
      kit('esc','Escritórios','Processos sem retrabalho',410,460),
    ].join(''),
  },
};
const d = V[v];
document.getElementById("serif").textContent = d.serif;
document.getElementById("h1").innerHTML = d.h1;
document.getElementById("cta").textContent = d.cta;
document.getElementById("stage").innerHTML = d.stage;
</script>
</body>
</html>
