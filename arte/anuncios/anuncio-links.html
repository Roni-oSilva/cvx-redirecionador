<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carvex — Anúncios Site Oficial, Excels e Hotmart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Inter Tight", system-ui, sans-serif; color: #fff; overflow: hidden; position: relative; background: radial-gradient(ellipse at 72% 52%, var(--c1) 0%, var(--c2) 42%, var(--c3) 100%); }
body.t-oficial { --c1:#5b21b6; --c2:#2a0f5e; --c3:#0a0618; --acc:#d8b4fe; --btn:#3b1482; --soft:rgba(167,139,250,.22); --glow:rgba(192,132,252,.7); --bar1:#7c3aed; --bar2:#d8b4fe; --ink:#3b1482; }
body.t-excels  { --c1:#0f7a3e; --c2:#06351c; --c3:#02120a; --acc:#6ee7a0; --btn:#065f2e; --soft:rgba(52,211,153,.2); --glow:rgba(52,211,153,.65); --bar1:#16a34a; --bar2:#86efac; --ink:#065f2e; }
body.t-hotmart { --c1:#1d4fd8; --c2:#0a2c8a; --c3:#041348; --acc:#8ec5ff; --btn:#0a2c8a; --soft:rgba(142,197,255,.22); --glow:rgba(90,169,255,.7); --bar1:#1a5cff; --bar2:#8ec5ff; --ink:#0a2c8a; }
body.sq { width:1080px; height:1080px; --k:.7; --h:72px; --pt:52px; --pb:46px; }
body.fd { width:1080px; height:1350px; --k:1.12; --h:86px; --pt:62px; --pb:54px; }
body.st { width:1080px; height:1920px; --k:1.28; --h:100px; --pt:250px; --pb:320px; }
.wrap { position:relative; height:100%; padding:var(--pt) 60px var(--pb); display:flex; flex-direction:column; align-items:center; text-align:center; }
.logo { height:70px; display:block; }
.eyebrow { margin-top:22px; padding:10px 24px; border-radius:999px; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.3); font-size:23px; font-weight:700; letter-spacing:.12em; }
h1 { margin-top:22px; font-size:var(--h); line-height:1; font-weight:800; letter-spacing:-.03em; }
h1 em { font-style:normal; color:var(--acc); }
.sub { margin-top:18px; font-size:calc(var(--h) * .34); line-height:1.28; color:rgba(255,255,255,.88); max-width:880px; }
.stagewrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; padding-top:14px; }
.stage { position:relative; width:800px; height:560px; transform:scale(var(--k)); flex:none; margin:calc((560px * var(--k) - 560px) / 2) calc((800px * var(--k) - 800px) / 2); }
.cta { display:inline-flex; align-items:center; gap:14px; background:#fff; color:var(--btn); font-weight:800; font-size:37px; padding:26px 54px; border-radius:999px; box-shadow:0 22px 60px -18px var(--glow), 0 0 0 8px rgba(255,255,255,.14); }
.cta svg { width:36px; height:36px; }
.foot { margin-top:22px; font-size:25px; font-weight:500; color:rgba(255,255,255,.85); }
.foot b { font-weight:700; color:#fff; }
.glass { position:absolute; border-radius:28px; background:linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.07)); border:1.5px solid rgba(255,255,255,.35); box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 0 20px rgba(255,255,255,.1); }
.chip { position:absolute; padding:13px 26px; border-radius:999px; background:#fff; color:var(--ink); font-weight:800; font-size:25px; white-space:nowrap; box-shadow:0 14px 36px rgba(0,0,0,.45); }
.lbl { font-size:18px; font-weight:700; opacity:.7; letter-spacing:.1em; margin-bottom:12px; }
.bars { display:flex; align-items:flex-end; gap:12px; height:170px; }
.bars i { flex:1; border-radius:9px 9px 0 0; background:linear-gradient(to top, var(--bar1), var(--bar2)); }
.flow { display:flex; align-items:center; justify-content:space-between; position:relative; height:64px; }
.flow::before { content:""; position:absolute; left:6%; right:6%; top:50%; height:2px; background:rgba(255,255,255,.35); }
.flow span { position:relative; width:56px; height:56px; border-radius:17px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); display:grid; place-items:center; }
.flow span::after { content:""; width:13px; height:13px; border-radius:50%; background:var(--acc); }
.wire { height:100%; display:flex; flex-direction:column; gap:10px; }
.wire .a { height:90px; border-radius:14px; background:linear-gradient(135deg, var(--bar2), var(--bar1)); }
.wire .l { height:10px; border-radius:6px; background:rgba(255,255,255,.5); }
.wire .b { margin-top:auto; height:34px; width:50%; border-radius:999px; background:#fff; }

/* planilha */
.xl { position:absolute; left:20px; top:10px; width:560px; border-radius:22px; background:#06150e; border:1.5px solid rgba(255,255,255,.25); box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.08); overflow:hidden; }
.xl .bar { padding:12px 18px; background:#0b2a1b; font-size:17px; font-weight:700; display:flex; gap:7px; align-items:center; }
.xl .bar i { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.4); }
.xl .bar span { margin-left:10px; opacity:.85; }
.xl table { width:100%; border-collapse:collapse; font-size:20px; font-variant-numeric:tabular-nums; }
.xl th { background:#0f3d26; padding:12px; font-weight:700; text-align:left; font-size:17px; color:#b7f7d1; }
.xl td { padding:12px; border-top:1px solid rgba(255,255,255,.08); color:#d9fbe7; }
.xl td.y { background:#facc15; color:#3f2f00; font-weight:700; }
.xl td.g { background:#14532d; color:#b7f7d1; font-weight:700; }

/* produtos */
.prod { position:absolute; left:60px; width:560px; padding:20px 24px; border-radius:26px; display:flex; align-items:center; gap:20px; text-align:left;
  background:linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.07)); border:1.5px solid rgba(255,255,255,.36); box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
.prod i { width:70px; height:70px; border-radius:20px; background:#fff; display:grid; place-items:center; flex:none; }
.prod i svg { width:38px; height:38px; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.prod b { display:block; font-size:30px; font-weight:800; line-height:1.05; }
.prod span { display:block; margin-top:6px; font-size:20px; color:rgba(255,255,255,.82); }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="../../assets/logo.png" alt="Carvex">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="stagewrap"><div class="stage" id="stage"></div></div>
  <div class="cta"><span id="cta"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <p class="foot"><b id="url"></b> &nbsp;·&nbsp; @carvex_lab</p>
</div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get("v") || "oficial", f = q.get("f") || "sq";
document.body.classList.add(f, "t-" + v);
const SV = {
  tpl:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h8"/></svg>',
  dash:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  kit:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/></svg>',
};
const V = {
  oficial: {
    eyebrow: "CARVEX TECHNOLOGY",
    h1: 'Tecnologia que trabalha <em>por você.</em>',
    sub: "Landing pages, painéis e automações para o seu negócio crescer.",
    cta: "Falar com a Carvex", url: "carvex-one.vercel.app",
    stage: `
      <div class="glass" style="left:30px;top:20px;width:470px;padding:24px"><div class="lbl">PAINEL</div><div class="bars"><i style="height:40%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:82%"></i><i style="height:66%"></i><i style="height:94%"></i></div></div>
      <div class="glass" style="left:0;top:270px;width:210px;height:290px;padding:18px"><div class="wire"><div class="a"></div><div class="l" style="width:80%"></div><div class="l" style="width:55%;opacity:.5"></div><div class="b"></div></div></div>
      <div class="glass" style="right:10px;bottom:20px;width:520px;padding:24px 26px"><div class="lbl">AUTOMAÇÃO</div><div class="flow"><span></span><span></span><span></span></div></div>
      <div class="chip" style="right:20px;top:60px;transform:rotate(5deg)">Landing Pages</div>
      <div class="chip" style="right:150px;top:230px;transform:rotate(-4deg)">Business Intelligence</div>`,
  },
  excels: {
    eyebrow: "CARVEX XLS",
    h1: 'Planilhas que <em>resolvem</em> a dor do seu negócio.',
    sub: "10 planilhas Excel com fórmulas, dashboard e tutorial passo a passo. Pagamento único, sem mensalidade.",
    cta: "Ver as 10 planilhas", url: "carvex-excels.vercel.app",
    stage: `
      <div class="xl"><div class="bar"><i></i><i></i><i></i><span>Fluxo-de-Caixa.xlsx — Excel</span></div>
        <table><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr>
        <tr><td>Jan</td><td class="y">42.300</td><td class="y">36.100</td><td class="g">6.200</td></tr>
        <tr><td>Fev</td><td class="y">38.900</td><td class="y">35.400</td><td class="g">3.500</td></tr>
        <tr><td>Mar</td><td class="y">51.200</td><td class="y">41.900</td><td class="g">9.300</td></tr>
        <tr><td>Abr</td><td class="y">47.800</td><td class="y">40.200</td><td class="g">7.600</td></tr></table>
        <div style="padding:16px 18px 18px;background:#06150e"><div class="bars" style="height:110px"><i style="height:45%"></i><i style="height:30%"></i><i style="height:80%"></i><i style="height:62%"></i><i style="height:92%"></i><i style="height:70%"></i></div></div></div>
      <span class="chip" style="right:0;top:40px;transform:rotate(5deg)">Fórmulas prontas</span>
      <span class="chip" style="right:20px;top:250px;transform:rotate(-4deg)">Dashboard</span>
      <span class="chip" style="right:0;top:380px;transform:rotate(4deg)">Sem macros</span>
      <span class="chip" style="left:130px;bottom:-4px;transform:rotate(-3deg)">Tutorial incluso</span>`,
  },
  hotmart: {
    eyebrow: "CARVEX NA HOTMART",
    h1: 'Pare de montar tudo <em>do zero.</em>',
    sub: "Páginas de venda, painéis de leads e kits de orçamento prontos. Baixe, edite e use.",
    cta: "Ver produtos", url: "hotmart-cvx.vercel.app",
    stage: `
      <div class="prod" style="top:10px;left:100px"><i>${SV.tpl}</i><div><b>Templates de página</b><span>5 modelos prontos para editar</span></div></div>
      <div class="prod" style="top:200px;left:20px"><i>${SV.dash}</i><div><b>Painéis de leads</b><span>10 nichos, no Excel</span></div></div>
      <div class="prod" style="top:390px;left:140px"><i>${SV.kit}</i><div><b>Kits de orçamento</b><span>Planilhas e modelos, a partir de R$ 49</span></div></div>
      <span class="chip" style="right:0;top:110px;transform:rotate(5deg)">Compra segura</span>
      <span class="chip" style="right:10px;top:330px;transform:rotate(-4deg)">Baixou, editou, usou</span>`,
  },
};
const d = V[v];
document.getElementById("eyebrow").textContent = d.eyebrow;
document.getElementById("h1").innerHTML = d.h1;
document.getElementById("sub").textContent = d.sub;
document.getElementById("cta").textContent = d.cta;
document.getElementById("url").textContent = d.url;
document.getElementById("stage").innerHTML = d.stage;
</script>
</body>
</html>
